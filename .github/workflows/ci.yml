      name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed test database
        run: |
          python - <<'PY'
          import hashlib

          from app.db.session import SessionLocal
          from app.models import Court, Case

          db = SessionLocal()

          court = db.get(Court, 1)

          if court is None:
              court = Court(
                  id=1,
                  name="Supreme Court of the United States",
                  abbreviation="SCOTUS",
                  jurisdiction="US",
                  level="supreme",
              )
              db.add(court)
              db.commit()

          case = db.get(Case, 36)

          if case is None:
              opinion = (
                  "This test opinion discusses standing "
                  "and Article III standing."
              )

              content_hash = hashlib.sha256(
                  opinion.encode("utf-8")
              ).hexdigest()

              case = Case(
                  id=36,
                  external_id="ci-case-36",
                  case_name="Allen v. Milligan",
                  court_id=1,
                  decision_date=None,
                  docket_number="CI-36",
                  opinion_text=opinion,
                  source_url="https://example.com/ci-case-36",
                  content_hash=content_hash,
              )

              db.add(case)
              db.commit()

          db.close()
          PY

      - name: Run tests
        run: |
            python -m pytest test -v --tb=short